<!DOCTYPE html>
<html>
<head>
	<title></title>
	<meta charset="UTF-8">
	<link rel="stylesheet" href="fonts/font.css">
	<link rel="stylesheet" href="css/carInventory.css">
</head>
<body>
	<div class="inventory">		
		<div class="left-inventory">			
			<div class="close">Закрыть</div>
			<div class="items">
				<div class="search-wrapper">
					<div class="search-item">
						<input type="number" id="searchInput" placeholder="Введите № документа">
						<div class="button" id="searchConfirm">Найти</div>
					</div>
					<div class="find-item">
						<div class="find-icon"></div>
						<div class="button-wrapper">
							<div class="button" id="takeDocument">Сделать копию</div>
							<!-- <div class="button" id="previewDocument">Посмотреть</div> -->
						</div>
						<div class="button" id="cancel" style="margin-top:15px;">Отмена</div>
					</div>
					<div class="show-wrapper">
						<div class="find-icon"></div>
						<div class="button-wrapper">
							<div class="button" id="putDocument">Положить</div>
							<div class="button" id="cancel">Отмена</div>
						</div>
					</div>
				</div>
				<ul id="luggage" style="margin-top:60px;"></ul>
			</div>
			<!-- <div class="weight">
				<span class="current">0</span><span>/</span><span class="max">50</span>kg
			</div>	 -->
		</div>
		<div class="right-inventory">			
			<div class="tabs-inventory">
				<ul>
				</ul>
			</div>		
			<div class="item-inventory">
				<div class="items">
					<ul id="inventory">
						 
					</ul>
				</div>
				<!-- <div class="weight">
					<span class="current">0</span><span>/</span><span class="max">0</span>kg
				</div>				 -->
			</div>
		</div>
	</div>
	<div class="info-wrapper">
		<div class="title"></div>
	</div>
	<div class="col-wrapper">
		<div class="title">Введите количество: <span class="col-title"></span></div>
		<div class="input-wrapper">
			<div class="min">
				<div class="min-title">MIN</div>
				<div class="min-numb">1</div>
			</div>
			<input class="quantity" type="number" min="1" max="150" value="1">
			<div class="max">
				<div class="max-title">MAX</div>
				<div class="max-numb">150</div>
			</div>
		</div>	
		<div class="button-wrapper">
			<div class="ok-button">Ок</div>
			<div class="cancel-button">Отменить</div>
		</div>
	</div>
</body>
	<script src="js/jquery-3.3.1.min.js" ></script>
	<script src="js/jquery-ui.min.js"></script>
	<script src="js/jquery.mousewheel.min.js"></script>
	<script src="js/jquery.scrollTo.min.js"></script>
	<script src="js/ammoList.js"></script>
	<script src="js/documentInventory.js"></script>
</html>
