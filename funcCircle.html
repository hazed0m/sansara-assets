<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/roll.css">
        <link rel="stylesheet" href="fonts/font.css">
	</head>
	<body>
        <div id="animCircle">
            <div class="animation-circle-wrap">
                <div class="menu">
                    <div class="center">
                        <div class="imagesBlock">
                            <img src="images/hud/roll.png" alt="">
                        </div>
                    </div>
                    <ul>
                        <li class="active">
                            <div class="slot slot1" data-action="showPassport">Показать паспорт</div>
                        </li>
                        <li class="active">
                            <div class="slot slot2" data-action="giveMoney">Передать деньги</div>
                        </li>
                        <li class="active">
                            <div class="slot slot3" data-action="takePassport">Попросить паспорт</div>
                        </li>
                        <li class="active">
                            <div class="slot slot4" data-action="takeSearch">Произвести обыск</div>
                        </li>
                        <li class="active">
                            <div class="slot slot5" data-action="takeHandcuff">Надеть наручники/мешок</div>
                        </li>                        
                        <li class="deactivated">
                            <div class="slot slot6" data-action="empty">Отсутствует</div>
                        </li>
                        <li class="active">
                            <div class="slot slot7" data-action="giveKeys">Передать ключи</div>
                        </li>
                        <li class="active">
                            <div class="slot slot8" data-action="meet">Познакомиться</div>
                        </li>                        
                    </ul>
                </div>          
            </div>
        </div>
    </body> 
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/funcCircle.js"></script>
</html>
