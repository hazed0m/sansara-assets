<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/roll.css">
        <link rel="stylesheet" href="fonts/font.css">
	</head>
	<body>
        <div id="animCircle">
            <div class="animation-circle-wrap">
                <div class="menu">
                    <div class="center">
                        <div class="imagesBlock">
                            <img src="images/hud/roll.png" alt="">
                        </div>
                    </div>
                    <ul>
                        <li class="active">
                            <div class="slot slot1" data-action="showPassport">показать паспорт</div>
                        </li>
                        <li class="active">
                            <div class="slot slot2" data-action="giveMoney">передать деньги</div>
                        </li>
                        <li class="active">
                            <div class="slot slot3" data-action="takePassport" style="margin-left: 182px;margin-top: 43px;">попросить паспорт</div>
                        </li>
                        <li class="active">
                            <div class="slot slot4" data-action="takeSearch">произвести обыск</div>
                        </li>                                              
                        <li class="active">
                            <div class="slot slot5" data-action="meet">познакомиться</div>
                        </li> 
                        <li class="active">
                            <div class="slot slot6" data-action="takeHandcuff">надеть <br>снять <br>наручники</div>
                        </li>                          
                        <li class="active">
                            <div class="slot slot7" data-action="giveHouseKeys">передать ключи от квартиры</div>
                        </li>
                        <li class="active">
                            <div class="slot slot8" data-action="takeBag">надеть <br>снять <br>мешок</div>
                        </li>                   
                    </ul>
                </div>          
            </div>
            <div class="col-wrapper">
                <div class="title">Введите количество денег:</div>
                <div class="input-wrapper">
                    <div class="min">
                        <div class="min-title">MIN</div>
                        <div class="min-numb">1</div>
                    </div>
                    <input class="quantity" type="number" min="1" max="10000" value="1">
                    <div class="max">
                        <div class="max-title">MAX</div>
                        <div class="max-numb">10000</div>
                    </div>
                </div>	
                <div class="button-wrapper">
                    <div class="ok-button">Ок</div>
                    <div class="cancel-button">Отменить</div>
                </div>
            </div>
        </div>
    </body> 
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/funcCircle.js"></script>
</html>
