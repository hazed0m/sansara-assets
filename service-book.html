<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/service-book.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="page active" id="page1">
                <div class="page-item" id="carNumber">
                    <div class="top-block">
                        Номер
                    </div>
                    <div class="text-block"></div>
                </div>
                <div class="page-item" id="sellDate">
                    <div class="top-block">
                        Дата продажи
                    </div>
                    <div class="text-block"></div>
                </div>
                <div class="page-item" id="carType">
                    <div class="top-block">
                        Марка автомобиля
                    </div>
                    <div class="text-block"></div>
                </div>
                <div class="page-item" id="carScore">
                    <div class="top-block">
                        Пробег
                    </div>
                    <div class="text-block"></div>
                </div>
            </div>
            <div class="page" id="page2">
                <div class="page-item" id="dateOf">
                    <div class="top-block">
                        Дата
                    </div>
                    <div class="text-block"></div>
                </div>
                <div class="page-item" id="doneWorks">
                    <div class="top-block">
                        Произведенные работы
                    </div>
                    <div class="text-block big"></div>
                </div>
            </div>
            <div class="close-but">
                <img src="img/service-book/close.png" alt="">
            </div>
            <div class="buttons-wrapper">
                <div class="left">
                    <img src="img/service-book/arrow-left.png" alt="">
                </div>
                <div class="right">
                    <img src="img/service-book/arrow-right.png" alt="">
                </div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/service-book.js"></script>
</body>
</html>
