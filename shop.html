<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>shop</title>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
	<link rel="stylesheet" href="css/shop.css">
	<link rel="stylesheet" href="fonts/font.css">
</head>
<body>
	<div class="container">
		<div class="exit-but">Закрыть</div>
		<div class="wrapper">
			<div class="shop-wrap">
				<div class="shop-inner">
					
				</div>
			</div>
			<div class="basket-wrap">
				<div class="title">Корзина</div>
				<div class="basket-list">
					<div class="empty-but">Очистить корзину</div>	
				</div>
				<div class="bottom-wrap">
					<div class="left-wrap">
						<div class="radio-block">
							<div class="card">
								<img src="img/shop/card.png" alt="card">
								<i class="far fa-circle"></i>
							</div>
							<div class="cash active">
								<img src="img/shop/cash.png" alt="card">
								<i class="fas fa-circle"></i>
							</div>						
						</div>
					</div>
					<div class="right-wrap">
						<div class="price"><span>0</span>$</div>
						<div class="button" id="buy">Купить</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script src="js/jquery-3.3.1.min.js"></script>
	<script src="js/shop.js"></script>
</body>
</html>
