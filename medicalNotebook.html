<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>note</title>
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/animate.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/medicalNotebook.css">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="startup-mask">
                <div class="img-block animated delay flipOutY">
                    <img src="img/logo-sansara.png" alt="sansara">
                </div> 
            </div>
            <div class="business-wrapper" id="medical">
                <div class="mask"></div>
                <div class="search-block">
                    <input type="text" placeholder="Введите Имя/Номер">
                    <div class="button" id="searchStory">Поиск</div>
                    <div class="text-info">
                        <p>*Имя должно быть введено полностью</p>
                        <p>*Номер должен состоять из 6 символов</p>
                    </div>
                </div>
                <div class="content-block animated">

                </div>
            </div>
            <div class="morgue-wrapper">
                <iframe id="morgue-frame" src="http://server.sansararp.com/mc/morgue" frameborder="0" width="100%" height="100%"></iframe>
            </div>
            <div class="employee-wrapper active">
                <iframe id="employee-frame" src="http://server.sansararp.com/mc/employee" frameborder="0" width="100%" height="100%"></iframe>
            </div>
            <div class="handbook-wrapper">
                <iframe id="handbook-frame" src="http://server.sansararp.com/mc/handbook" frameborder="0" width="100%" height="100%"></iframe>
            </div>
            <div class="charter-wrapper">
                <iframe id="charter-frame" src="http://server.sansararp.com/mc/charter" frameborder="0" width="100%" height="100%"></iframe>
            </div>
            <div class="police-menu">
                <div class="menu-item active" id="employee-wrapper">Список сотрудников</div>
                <div class="menu-item" id="business-wrapper">История болезней</div>
                <div class="menu-item" id="morgue-wrapper">Морг</div>
                <div class="menu-item" id="handbook-wrapper">Cправочник</div>
                <div class="menu-item" id="charter-wrapper">Устав</div>
                <!-- <div class="close-but"><i class="fas fa-times"></i></div> -->
            </div>
            <div class="sansara-menu animated">
                <div class="menu-item" id="police-menu">Меню</div>
                <div class="menu-item" id="noteExit">Выйти</div>
            </div>
            <div class="bottom-panel">
                <div class="left-wrapper">
                    <div class="menu-but" id="sansara-menu"></div>
                    <div class="used-app"><img src="img/notebook/medical-ico.png" alt=""></div>
                </div>
                <div class="right-wrapper">
                    <div class="wi-fi"></div>
                    <div class="lang">РУС</div>
                    <div class="time-wrapper">
                        <div class="time">15:00</div>
                        <div class="date">22.03.2019</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/font-awesome.min.js"></script>    
    <script src="js/medicalNotebook.js"></script>
</body>
</html>
