<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fonts/font.css">
	<link rel="stylesheet" href="css/slider.css?124">
    <link rel="stylesheet" href="css/remakingResources.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title-block">
				<div>Переработка</div> 
			</div>
            <div class="inner-wrap">
                <div class="resource-item">
                    <div class="title"></div>
                    <div class="counters-list">
                        <div class="min">Мин. 0</div>
                        <div class="current-count">
                           Тек.
                            <span>0</span>
                        </div>
                        <div class="max">
                            Макс.
                            <span></span>
                        </div>
                    </div>
                    <input type="range" class="slick appearanceOpacity" value="0" min="0" max="100" step="1" id="resource">
                </div>
            </div>
            <div class="button disabled" id="remakeResources">Переработать</div>
            <div class="progress-bar">
                <div class="title">Идет переработка</div>
                <div class="inside-block">
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>  
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div>  
                   <div class="block"></div>
                   <div class="block"></div>
                   <div class="block"></div> 
                   <div class="block"></div>
                   <div class="block"></div>               
                </div>
            </div> 
            <div class="mask"></div>
            <div class="button" id="Done">Готово</div>
        </div>
        <div class="button" id="Close">Закрыть</div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>    
	<script src="js/slider.min.js"></script>
    <script src="js/remakingResources.js"></script>
</body>
</html>
