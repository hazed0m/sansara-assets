<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/policeGarage.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title">Гараж Полицейского Департамента</div>
            <div class="garage-wrapper">
                <div class="garage-item" id="lspd1">
                    <div class="img-block">
                        <img src="img/lspd1.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-1</div>
                </div>
                <div class="garage-item closed" id="lspd2">
                    <div class="img-block">
                        <img src="img/lspd2.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-2</div>
                </div>
                <div class="garage-item closed" id="lspd3">
                    <div class="img-block">
                        <img src="img/lspd3.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-3</div>
                </div>
                <div class="garage-item closed" id="lspd4"> 
                    <div class="img-block">
                        <img src="img/lspd4.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-4</div>
                </div>
                <div class="garage-item closed" id="lspd5">
                    <div class="img-block">
                        <img src="img/lspd5.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-5</div>
                </div>
                <div class="garage-item closed" id="lspd6">
                    <div class="img-block">
                        <img src="img/lspd6.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-6</div>
                </div>
                <div class="garage-item closed" id="lspd7">
                    <div class="img-block">
                        <img src="img/lspd7.png" alt="">
                    </div>
                    <div class="garage-name">LSPD-7</div>
                </div>
            </div>
            <div class="button-block">
                <div class="button disabled" id="use">Использовать</div>
                <div class="button" id="close">Закрыть</div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/policeGarage.js"></script>
</body>
</html>
