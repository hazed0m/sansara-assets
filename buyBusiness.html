<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>buyBusiness</title>	
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">	
	<link rel="stylesheet" href="fonts/font.css">
	<link rel="stylesheet" href="css/buyBusiness.css">
</head>
<body>
	<div class="container">
		<div class="close-but">Закрыть</div>
		<div class="wrapper">
			<div class="title"></div>
			<div class="bus-list-title">Доступно к продаже</div>
			<ul class="bus-list">
			</ul>
		</div>
		<div class="price-block"><span>Стоимость</span> <div class="price-wrap"><span class="sell-price">0</span><span> $</span></div></div>
		<div class="bottom-wrap">
			<div class="left-wrap">
				<div class="radio-block">
					<div class="card">
						<img src="img/shop/card.png" alt="card">
						<i class="far fa-circle"></i>
					</div>
					<div class="cash active">
						<img src="img/shop/cash.png" alt="card">
						<i class="fas fa-circle"></i>
					</div>						
				</div>
			</div>
			<div class="right-wrap">
				<div class="button" id="buy">Купить</div>
			</div>
		</div>
	</div>
	<script src="js/jquery-3.3.1.min.js"></script>
	<script src="js/buyBusiness.js"></script>
</body>
</html>
