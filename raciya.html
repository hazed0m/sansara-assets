<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>raciya</title>
	<link rel="stylesheet" href="fonts/font.css">
	<link rel="stylesheet" href="css/raciya.css">
</head>
<body>
	<div class="container">
		<div class="wrapper">
			<div class="lcd">
				<div class="wi-fi"></div>
				<!-- <div class="microphone"></div> -->
				<div class="lcd-wrapper">
					<div class="channel-name"></div>
					<div class="channel-numb"></div>
					<div class="volume-wrap">
						<div class="dynamic"></div>
						<div class="volume-block">
							<div class="volume-item"></div>
							<div class="volume-item"></div>
							<div class="volume-item active"></div>
							<div class="volume-item active"></div>
							<div class="volume-item active"></div>
							<div class="volume-item active"></div>
							<div class="volume-item active"></div>
							<div class="volume-item active"></div>
						</div>
					</div>
				</div>
			</div>
			<div class="button-block">
				<div class="button-wrap">
					<div class="little-button microphone-big"></div>
					<div class="little-button exit"></div>
				</div>
				<div class="big-button">
					<div class="volume up"></div>
					<div class="volume down"></div>
				</div>
				<div class="button-wrap">
					<div class="little-button arrow-up"></div>
					<div class="little-button arrow-down"></div>
				</div>
			</div>
		</div>
	</div>
	<script src="js/jquery-3.3.1.min.js"></script>
	<script src="js/raciya.js"></script>
</body>
</html>
