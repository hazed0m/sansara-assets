<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>craft</title>
	<link rel="stylesheet" href="fonts/font.css">
	<link rel="stylesheet" href="css/fontawesome.min.css">
	<link rel="stylesheet" href="css/craft.css">
</head>
<body>
	 <div class="container">
	 	<div class="wrapper">
	 		<div class="title-block">
	 			<div class="title-text">Создание объекта</div>
	 			<div class="title-name"></div>
	 		</div>
	 		<div class="needs-block">
	 			<div class="needs-title">Необходимые материалы..</div>
	 			<ul id="needs-list">
	 			</ul>
	 		</div>
	 		<div class="main-block">
	 		</div>
	 		<div class="final-block">
	 			<div class="block"></div>
	 			<div class="counter-wrap">
	 				<span>Количество</span>
	 				<div class="quantity-block">					   
					   <input class="quantity-num" type="number" value="0" onkeypress="return false"/>
					   <div class="button-wrap">
						   <button class="quantity-arrow-plus blocked"><img src="img/caret-up-solid.svg" alt=""></button>
						   <button class="quantity-arrow-minus blocked"><img src="img/caret-down-solid.svg" alt=""></button>
					   </div>
					</div>
	 				<div class="create-but blocked">Создать</div>
	 			</div>	 			
	 		</div>	 		
			<div class="exit-but">Выход</div>
	 	</div>
	 </div>
	<script src="js/jquery-3.3.1.min.js"></script>
	<script src="js/productsList.js"></script>
	<script src="js/craft.js"></script>
</body>
</html>
