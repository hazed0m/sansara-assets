<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">

        <div class="wrapper">
            <div class="title-wrapper"></div>
            <div class="inner-wrapper">

                </div>

                    <!-- <div class="button" id="treatment">Лечение</div> -->
                    <div class="button" id="sendHome">Отправить домой</div>
                    <div class="button" id="print">Печать документа</div>
                    <div class="button" id="closeMenu">Закрыть</div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/personalCard.js"></script>
