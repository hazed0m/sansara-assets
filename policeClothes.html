<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/policeClothes.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title">Гардероб Полицейского Департамента</div>
            <p class="top-title">Гражданская одежда</p>
            <div class="toogle-wrap">
                <input type="checkbox" id="toogle" />
                <label class="slider-v2" for="toogle"></label>
            </div>
            <div class="clothes-wrapper">
                <div class="clothes-category-title">
                    Маска
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Mask">
                </div>
                <div class="clothes-category-title">
                    Шляпа
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Hat">
                </div>
                <div class="clothes-category-title">
                    Очки
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Glasses">
                </div>
                <div class="clothes-category-title">
                    Аксессуары
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="acessories">
                </div>
                <div class="clothes-category-title">
                    Верх
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Top">
                </div>
                <div class="clothes-category-title">
                    Серьги
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Earrings">
                </div>
                <div class="clothes-category-title">
                    Браслет
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Bracelet">
                </div>
                <div class="clothes-category-title">
                    Низ
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Bottom">
                </div>
                <div class="clothes-category-title">
                    Часы
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Clock">
                </div>
                <div class="clothes-category-title">
                    Бронежилет
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Armor">
                </div>
                <div class="clothes-category-title">
                    Обувь
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Shoes">
                </div>
                <div class="clothes-category-title">
                    Сумка
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="Bag">
                </div>
            </div>
            <div class="button-block">
                <div class="button disabled" id="use">Использовать</div>
                <div class="button" id="close">Закрыть</div>
            </div>
        </div>
        <div class="admin-wrapper">  
            <div class="title">Сохранение комплекта</div>
            <input type="text" id="setText">
            <div class="button disabled" id="saveSet">Сохранить</div>
        </div>
    </div>    
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/policeClothes.js"></script>
</body>
</html>
