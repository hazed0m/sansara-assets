<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/policeClothes.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title">Гардероб Полицейского Департамента</div>
            <div class="clothes-wrapper">
                <div class="clothes-category-title">
                    Аксессуары
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="acessories">
                    <div class="clothes-item" data-id="Бронежилет">
                        <div class="weapon-name">Бронежилет</div>
                        <img src="images/person/Armor.png" alt="">
                    </div>
                </div>
                <div class="clothes-category-title">
                    Верх
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="top">
                    <div class="clothes-item" data-id="Куртка">
                        <div class="weapon-name">Куртка</div>
                        <img src="images/person/Top.png" alt="">
                    </div>
                </div>
                <div class="clothes-category-title">
                    Низ
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="clothes-category-wrapper" id="bottom">
                    <div class="clothes-item" data-id="Штаны">
                        <div class="weapon-name">Штаны</div>
                        <img src="images/person/Bottom.png" alt="">
                    </div>
                    <div class="clothes-item" data-id="Штаны">
                        <div class="weapon-name">Штаны</div>
                        <img src="images/person/Bottom.png" alt="">
                    </div>
                </div>
            </div>
            <div class="button-block">
                <div class="button" id="use">Использовать</div>
                <div class="button" id="close">Закрыть</div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/policeClothes.js"></script>
</body>
</html>
