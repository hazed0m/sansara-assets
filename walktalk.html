<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/walktalk.css">
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="button" id="micro"><i class="fas fa-microphone"></i></div>
            <div class="screen">
                <div class="pin-block empty">
                    <div class="pin-item" id="pi1">-</div>
                    <div class="pin-item" id="pi2">-</div>
                    <div class="pin-item" id="pi3">-</div>
                    <div class="pin-item" id="pi4">-</div>
                </div>
                <div class="inform-block">Enter PIN</div>
                <div class="microphone-status"><i class="fas fa-microphone"></i></div>
                <div class="network-status active"><i class="fas fa-wifi"></i></div>
                <div class="channel-block">
                    <div class="channel-item blocked" id="ci1">0</div>
                    <div class="channel-item blocked" id="ci2">0</div>
                    <div class="channel-item" id="ci3">0</div>
                    <div class="channel-item" id="ci4">1</div>
                </div>
            </div>
            <div class="button-block">
                <div class="button" id="key"><i class="fas fa-key"></i></div>
                <div class="button" id="edit"><i class="fas fa-pen"></i></div>
                <div class="button" id="confirm"><i class="fas fa-check"></i></div>
                <div class="button" id="prev"><i class="fas fa-chevron-left"></i></div>
                <div class="button" id="next"><i class="fas fa-chevron-right"></i></div>
            </div>
            <div class="number-block">
                <div class="number-wrap">
                    <div class="button" id="ni1">1</div>
                    <div class="button" id="ni2">2</div>
                    <div class="button" id="ni3">3</div>
                    <div class="button" id="ni4">4</div>
                    <div class="button" id="ni5">5</div>                    
                </div>
                <div class="number-wrap sec">
                    <div class="button" id="ni6">6</div>
                    <div class="button" id="ni7">7</div>
                    <div class="button" id="ni8">8</div>
                    <div class="button" id="ni9">9</div>
                    <div class="button" id="ni0">0</div>
                </div>
            </div>
        </div>
    </div>
    <div class="notification">
		<div class="text">
		  В случае зависания управления над персонажем, сверните и разверните игру (ALT + Tab)
		</div>
		<div class="button" id="close">Закрыть</div>
  	</div>
	<div id="list_voicers" style="display: none;"></div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/peerjs.min.js"></script>    
    <script src="js/Resampler.js"></script>
    <script src="js/walktalk.js"></script>
</body>
</html>
