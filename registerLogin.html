<!DOCTYPE HTML>

<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/registerLogin.css?34">
        <link rel="stylesheet" href="fonts/font.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
	</head>
	<body>
        <div class="container">            
            <div class="popup-wrap" id="signin">
                <div class="logo-wrap">
                    <img src="images/auth/logo.png" alt="">
                </div>
                <div class="form-input__wrap">
                    <input class="form-input one" type="text" name="loginName" id="loginName" data-error="Не меньше 6 символов" required>
                    <label>Логин</label>                
                </div>
                <div class="form-input__wrap">
                    <input class="form-input two" type="password" name="loginPass" id="loginPass" data-error="Не меньше 6 символов" required>  
                    <label>Пароль</label>                    
                </div>
                <!-- <div class="g-recaptcha" id="g-recaptcha" data-sitekey="6LcShqcUAAAAAEFfGkm9KKambio8Ik5XGbD3Lruz"></div> -->
                <button class="form-btn login disabled" data-attr="1">Авторизация</button>
                <div class="form-more">Нет аккаунта? <span class="form-auth">Зарегистрироваться</span></div> 
            </div>
            <div class="popup-wrap" id="signup" style="display: none;">
                <div class="form-input__wrap">
                    <input class="form-input one" type="text" name="newLoginName" id="newLoginName" data-error="Не меньше 6 символов" required>
                    <label>Логин</label>    
                </div>
                
                <div class="form-input__wrap">
                    <input class="form-input two" type="password" name="newLoginPass" id="newLoginPass" data-error="Не меньше 6 символов" required>
                    <label>Пароль</label>    
                </div>
                
                <div class="form-input__wrap">
                    <input class="form-input three" type="text" name="newLoginEmail" id="newLoginEmail" data-error="sansara@rage.mp" required>  
                    <label>Почта</label>    
                </div>
                <!-- <div class="g-recaptcha" id="g-recaptcha1" data-sitekey="6LcShqcUAAAAAEFfGkm9KKambio8Ik5XGbD3Lruz"></div>           -->
                <button class="form-btn register disabled" data-attr="0">Продолжить..</button>
                <div class="form-more">Есть аккаунт? <span class="form-auth">Авторизация</span></div> 
            </div>
            <div class="rage">
                <img src="images/auth/rage.png" alt="">
            </div>
            <div class="social">
                <div class="social-disc" data-clipboard-text="discord.gg/HKETTPv"><div class="discord-wrap"><i class="fab fa-discord"></i></div>discord.gg/HKETTPv<div class="copy-info"><i class="fas fa-copy"></i></div></div>
                <div class="social-vk" data-clipboard-text="vk.com/sansaragta5" style="padding-top: 35px;"><div class="vk-wrap"><i class="fab fa-vk"></i></div>vk.com/sansaragta5<div class="copy-info"><i class="fas fa-copy"></i></div></div>
            </div>
            <div class="alert" style="display: none;">
                <i class="fal fa-info-circle"></i>
                <div class="alert-message"></div>
            </div>
        </div>    
    </body>
    <script src="js/jquery-3.3.1.min.js"></script> 
    <script src="js/font-awesome.min.js"></script>
    <script src="https://www.google.com/recaptcha/api.js?onload=onloadCallback&render=explicit&hl=ru"></script>
    <script src="js/clipboard.min.js"></script>
    <script src="js/notifications.js"></script>
</html>
