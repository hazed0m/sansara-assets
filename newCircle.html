<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/newCircle.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="small-circle" id="personCircle">
                <div class="inner">
                    <div class="small-item active" id="meet" data-translate="Познакомиться">
                        <img src="img/fractionCircle/friendship.png" alt="">
                    </div>
                    <div class="small-item active" id="showPassport" data-translate="Показать паспорт">
                        <img src="img/fractionCircle/multicard.png" alt="">
                    </div>
                    <div class="small-item active" id="giveMoney" data-translate="Передать деньги">
                        <img src="img/fractionCircle/giveMoney.png" alt="">
                    </div>
                    <div class="small-item active" id="reanimation" data-translate="Реанимация">
                        <img src="img/fractionCircle/reanimation.png" alt="">
                    </div>
                    <div class="small-item active" id="takeBag" data-translate="Надеть мешок">
                        <img src="img/fractionCircle/putBag.png" alt="">
                    </div>
                    <div class="small-item active" id="seatCar" data-translate="Посадить в машину">
                        <img src="img/fractionCircle/seatCar.png" alt="">
                    </div>
                    <div class="small-item active" id="toLead" data-translate="Сопровождать">
                        <img src="img/fractionCircle/accompany.png" alt="">
                    </div>
                    <div class="small-item active" id="takeHandcuff" data-translate="Надеть наручники">
                        <img src="img/fractionCircle/handcuff.png" alt="">
                    </div>
                    <div class="small-item active" id="takeSearch" data-translate="Обыскать">
                        <img src="img/fractionCircle/search.png" alt="">
                    </div>
                    <div class="info-circle"></div>
                </div>
            </div>
        </div>
        <div class="col-wrapper">
            <div class="title">Введите количество: <span class="col-title">AK-47</span></div>
            <div class="input-wrapper">
                <div class="min">
                    <div class="min-title">MIN</div>
                    <div class="min-numb">1</div>
                </div>
                <input class="quantity" type="number" min="1" max="150" value="1">
                <div class="max">
                    <div class="max-title">MAX</div>
                    <div class="max-numb">150</div>
                </div>
            </div>	
            <div class="button-wrapper">
                <div class="ok-button">Ок</div>
                <div class="cancel-button">Отменить</div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/circletype.min.js"></script>
    <script src="js/newCircle.js"></script>
</body>
</html>
