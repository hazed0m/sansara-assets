<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="fonts/font.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/policeWardrobe.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div class="title">Гардероб Полицейского Департамента</div>
            <div class="wardrobe-wrapper">
                <div class="wardrobe-category-title">
                    Верх
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="wardrobe-category-wrapper" id="Set">
                </div>
                <div class="wardrobe-category-title">
                    Низ
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="wardrobe-category-wrapper" id="Bottom">
                </div>
                <div class="wardrobe-category-title">
                    Аксессуар
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="wardrobe-category-wrapper" id="Accessories">
                </div>
                <div class="wardrobe-category-title">
                    Шляпа
                    <i class="fas fa-arrow-down"></i>
                </div>  
                <div class="wardrobe-category-wrapper" id="Hat">
                </div>
            </div>
            <div class="button-block">
                <div class="button disabled" id="use">Использовать</div>
                <div class="button" id="close">Закрыть</div>
            </div>
        </div>
    </div>
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/font-awesome.min.js"></script>
    <script src="js/policeWardrobe.js"></script>
</body>
</html>
