<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/roll.css">
        <link rel="stylesheet" href="fonts/font.css">
	</head>
	<body onmousemove="mouse_position(event)" onload="mouse_position(event)">
        <div id="animCircle">
            <div class="animation-circle-wrap">
                <div class="menu">
                    <div class="center">
                        <div class="imagesBlock">
                            <img src="images/hud/roll.png" alt="">
                        </div>
                    </div>
                    <ul>
                        <li class="active">
                            <div class="slot slot1" style="margin-left:39px;margin-top: 141px;" data-action="carAction">открыть </br>закрыть </br>машину</div>
                        </li>
                        <li class="active">
                            <div class="slot slot2" style="margin-left:104px;margin-top: 102px;" data-action="luggageAction">открыть </br>закрыть </br>багажник</div>
                        </li>
                        <li class="active">
                            <div class="slot slot3" style="margin-left:205px;margin-top:30px;padding:0;" data-action="parking">припарковать</div>
                        </li>
                        <li class="active">
                            <div class="slot slot4" style="margin-left:164px;margin-top:20px;" data-action="cowlAction">отрыть </br>закрыть </br>капот</div>
                        </li>                        
                        <li class="active">
                            <div class="slot slot5" style="margin-left:114px;margin-top:10px;" data-action="changeLocker">сменить </br>замок</div>
                        </li>                          
                        <li class="active">
                            <div class="slot slot6" style="margin-left:44px;margin-top:56px;" data-action="giveCarKeys">передать </br>ключи </br>пассажиру</div>
                        </li>
                        <li class="active">
                            <div class="slot slot7" style="margin-left:-21px;margin-top:101px;" data-action="takeCarKeys">взять ключ</div>
                        </li>                                            
                        <li class="active">
                            <div class="slot slot8" style="margin-left:-17px;margin-top: 148px;" data-action="kickAway">выгнать </br>из машины</div>
                        </li>                  
                    </ul>
                </div>          
            </div>
            <div class="col-wrapper">
                <div class="title">Введите количество денег:</div>
                <div class="input-wrapper">
                    <div class="min">
                        <div class="min-title">MIN</div>
                        <div class="min-numb">1</div>
                    </div>
                    <input class="quantity" type="number" min="1" max="10000" value="1">
                    <div class="max">
                        <div class="max-title">MAX</div>
                        <div class="max-numb">10000</div>
                    </div>
                </div>	
                <div class="button-wrapper">
                    <div class="ok-button">Ок</div>
                    <div class="cancel-button">Отменить</div>
                </div>
            </div>
        </div>
    </body> 
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/carCircle.js"></script>
</html>
