<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="fonts/font.css">
        <link rel="stylesheet" href="css/newCircle.css">
	</head>
	<body>
        <div class="container">
            <div class="wrapper">
                <div class="small-circle" id="carCircle">
                    <div class="inner">
                        <div class="small-item active" id="carAction" data-translate="Открыть машину">
                            <img src="img/fractionCircle/carAction.png" alt="">
                        </div>
                        <div class="small-item active" id="luggageAction" data-translate="Открыть багажник">
                            <img src="img/fractionCircle/luggageAction.png" alt="">
                        </div>
                        <div class="small-item active" id="parking" data-translate="Припарковать">
                            <img src="img/fractionCircle/parking.png" alt="">
                        </div>
                        <div class="small-item active" id="cowlAction" data-translate="Открыть капот">
                            <img src="img/fractionCircle/cowlAction.png" alt="">
                        </div>
                        <div class="small-item active" id="changeLocker" data-translate="Сменить замок">
                            <img src="img/fractionCircle/changeLocker.png" alt="">
                        </div>
                        <div class="small-item active" id="giveCarKeys" data-translate="Передать ключи от машины">
                            <img src="img/fractionCircle/giveCarKeys.png" alt="">
                        </div>
                        <div class="small-item active" id="takeCarKeys" data-translate="Взять ключи от машины">
                            <img src="img/fractionCircle/takeCarKeys.png" alt="">
                        </div>
                        <div class="small-item active" id="kickAway" data-translate="Выгнать из машины">
                            <img src="img/fractionCircle/kickAway.png" alt="">
                        </div>
                        <div class="small-item active" id="repair" data-translate="Произвести ремонт">
                            <img src="img/fractionCircle/repair.png" alt="">
                        </div>
                    </div>
                    <div class="info-circle"></div>
                </div>
            </div>
        </div>
        <script src="js/jquery-3.3.1.min.js"></script>
        <script src="js/circletype.min.js"></script>
        <script src="js/newCircle.js"></script>
    </body> 
</html>
