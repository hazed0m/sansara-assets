<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/roll.css">
        <link rel="stylesheet" href="fonts/font.css">
	</head>
	<body>
        <div id="animCircle">
            <div class="animation-circle-wrap">
                <div class="menu">
                    <div class="center">
                        <div class="imagesBlock">
                            <img src="images/hud/roll.png" alt="">
                        </div>
                    </div>
                    <ul>
                        <li class="active">
                            <div class="slot slot1" style="margin-left: 23px;margin-top: 146px;" data-action="carAction">Открыть / Закрыть машину</div>
                        </li>
                        <li class="active">
                            <div class="slot slot2" data-action="luggageAction">Открыть / Закрыть багажник</div>
                        </li>
                        <li class="active">
                            <div class="slot slot3" data-action="takeInOut">Сесть / Выйти</div>
                        </li>
                        <li class="active">
                            <div class="slot slot4" data-action="cowlAction">Отрыть / Закрыть капот</div>
                        </li>                        
                        <li class="active">
                            <div class="slot slot5" data-action="changeLocker">Сменить замок</div>
                        </li>                          
                        <li class="active">
                            <div class="slot slot6" data-action="giveCarKeys">Передать ключи пассажиру</div>
                        </li>
                        <li class="active">
                            <div class="slot slot7" data-action="takeCarKeys">Взять ключ</div>
                        </li>                                            
                        <li class="active">
                            <div class="slot slot8" data-action="doorAction">Открыть/Закрыть дверь</div>
                        </li>                  
                    </ul>
                </div>          
            </div>
            <div class="col-wrapper">
                <div class="title">Введите количество денег:</div>
                <div class="input-wrapper">
                    <div class="min">
                        <div class="min-title">MIN</div>
                        <div class="min-numb">1</div>
                    </div>
                    <input class="quantity" type="number" min="1" max="10000" value="1">
                    <div class="max">
                        <div class="max-title">MAX</div>
                        <div class="max-numb">10000</div>
                    </div>
                </div>	
                <div class="button-wrapper">
                    <div class="ok-button">Ок</div>
                    <div class="cancel-button">Отменить</div>
                </div>
            </div>
        </div>
    </body> 
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/carCircle.js"></script>
</html>
