<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>buyApartament</title>
	<link rel="stylesheet" href="fonts/font.css">
	<link rel="stylesheet" href="css/sellApartament.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
</head>
<body>
	<div class="container">
		<div class="wrapper">
			<div class="title-block">
				<div>Квартира</div> 
				<span>№</span>
				<span class="title-numb"></span>
			</div>
		</div>
		<div class="bottom-wrap">
			<div class="left-wrap">				
				<div class="button" id="changeLock">Сменить замок</div>				
				<div class="button" id="storage">Хранилище</div>				
				<div class="button" id="close">Закрыть</div>
			</div>
			<div class="right-wrap">				
				<div class="button" id="giveKey">Передать ключ</div>
				<div class="button" id="openStorage">Открыть хранилище</div>
				<div class="button" id="quit">Выйти</div>				
			</div>
		</div>
		<div class="sell-block">
			<div class="button" id="sell">Продать</div>
			<div class="sell-info">( Продать дом за <span class="price"></span><span>$</span> )</div>
		</div>
	</div>
	</div>	
	<script src="js/jquery-3.3.1.min.js"></script>
	<script src="js/sellApartament.js"></script>
</body>
</html>
