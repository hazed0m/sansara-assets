<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/roll.css">
        <link rel="stylesheet" href="fonts/font.css">
	</head>
	<body>
        <div id="animCircle">
            <div class="animation-circle-wrap">
                <div class="menu">
                    <div class="center">
                        <div class="imagesBlock">
                            <img src="images/hud/roll.png" alt="">
                        </div>
                    </div>
                    <ul>
                        <li class="active">
                            <div class="slot slot1" style="margin-left:26px;margin-top: 150px;" data-action="putHandcuff">надеть </br>наручники</div>
                        </li>
                        <li class="active">
                            <div class="slot slot2" style="margin-left:116px;margin-top: 109px;" data-action="toLead">вести</br>за собой</div>
                        </li>
                        <li class="active">
                            <div class="slot slot3" style="margin-left:196px;margin-top:36px;padding:0;" data-action="search">обыскать</div>
                        </li>
                        <li class="active">
                            <div class="slot slot4" style="margin-left:184px;margin-top:6px;" data-action="pushToAuto">посадить</br>в авто</div>
                        </li>                        
                        <li class="active">
                            <div class="slot slot5" style="margin-left:114px;margin-top:10px;" data-action="takePrints">снять</br>отпечатки</div>
                        </li>                          
                        <li class="active">
                            <div class="slot slot6" style="margin-left:33px;margin-top:49px;" data-action="openItem">вскрыть</div>
                        </li>
                        <li class="active">
                            <div class="slot slot7" style="margin-left:-21px;margin-top:101px;" data-action="searchEvidence">поиск улик</div>
                        </li>                                            
                        <li class="active">
                            <div class="slot slot8" style="margin-left:-33px;margin-top: 160px;" data-action="barrier">ограждение</div>
                        </li>                  
                    </ul>
                </div>          
            </div>
            <div class="col-wrapper">
                <div class="title">Введите количество денег:</div>
                <div class="input-wrapper">
                    <div class="min">
                        <div class="min-title">MIN</div>
                        <div class="min-numb">1</div>
                    </div>
                    <input class="quantity" type="number" min="1" max="10000" value="1">
                    <div class="max">
                        <div class="max-title">MAX</div>
                        <div class="max-numb">10000</div>
                    </div>
                </div>	
                <div class="button-wrapper">
                    <div class="ok-button">Ок</div>
                    <div class="cancel-button">Отменить</div>
                </div>
            </div>
        </div>
    </body> 
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/policeCircle.js"></script>
</html>
