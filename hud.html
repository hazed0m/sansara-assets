<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="UTF-8">
        <link rel="stylesheet" href="css/hud.css">
        <link rel="stylesheet" href="fonts/font.css">
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
	</head>
	<body>
        <div class="geo-wrapper">
            международный аэропорт лос-сантоса
        </div>
        <div class="buttons">
        </div>
        <div class="hud-wrap">
                <div class="hud-main">
                    <div class="hud-content">
                        <img src="./images/hud/logo.png" alt="logo" style="margin: 0 auto;">                     
                    </div>
                </div>
                <div class="hud-center">
                    <div class="hud-content">
                        <div class="hud-time">21:00</div>  
                        <div class="hud-voice"><i class="fa fa-microphone"></i></div>
                    </div>                    
                </div>
                <div class="hud-footer">
                    <div class="hud-needs__wrap">
                        <div class="prog-img water" style="background-image:url(img/hud/water/100.png);">
                        </div>
                        <div class="prog-img eat" style="background-image:url(img/hud/eat/100.png);">
                        </div>
                    </div>                        
                    <div class="hud-footer__wrap">
                        <div class="money-wrap">
                            <div class="money-img"><i class="fas fa-money-bill" style="font-size: 24px; color: green;"></i></div>
                            <div class="hud-money" id="cash">1000</div><div class="hud-money">$</div>
                        </div>
                        <div class="money-wrap" style="padding-top: 5px;">
                            <div class="money-img"><i class="fas fa-credit-card" style="font-size: 24px; color: goldenrod;"></i></div>
                            <div class="hud-money" id="card">1000</div><div class="hud-money">$</div>
                        </div>        
                    </div>
                    <div class="button" id="hover"><i class="fas fa-angle-double-up"></i></div>                
                </div>                
        </div>
    </body> 
    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/jquery-ui.min.js"></script>
    <script src="js/hud.js"></script>    
</html>
